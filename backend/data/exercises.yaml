# backend/data/exercises.yaml — 动作库（`exercise` 表的**唯一所有者**）
#
# 【这份文件是什么】
# spec §4.4 的 `exercise` 表由本文件**投影**而来（`app.refdata_prescription.sync_exercises`），
# 不是手工插行：YAML 是体育专家维护的知识资产，DB 行是它的投影，两个所有者会漂移。
# · `exercise_ref` 的唯一所有者 = **本文件的顶层键集**；
# · 每个动作 `impact_level` 的唯一所有者 = **本文件**（Plan02 账本 P2-B2）。spec §7.2 的
#   模板 YAML 字面形状里每个 block 也自带一份 `impact_level`，那是**副本**；负责校验两者
#   一致的是 Task 3 的模板加载器（不一致就在加载时响亮失败），本文件自己校验不住。
#
# 【条目形状】顶层键 = exercise_ref（小写字母开头，只含小写字母/数字/下划线），下面
# **恰好五个键**，多一个少一个都在加载时 ValueError（`load_exercises`）：
#   name          中文动作名，学生端显示
#   video_url     视频二维码 URL。⚠️ 本批一律是 **RFC 2606 占位符**
#                 `https://example.invalid/exercise/<ref>`：`.invalid` 是保留 TLD、DNS 保证
#                 不可解析，故它不可能被误当成一个真能打开的视频源。**不编造真实链接。**
#                 真实视频源须由项目组提供，届时整列替换并同步更新
#                 `tests/test_refdata_prescription.py` 的
#                 `test_video_urls_are_rfc2606_placeholders_keyed_by_ref` 与指纹常量。
#                 ⚠️ 这一条**尚未登记进 spec §14**：Task 2 只被授权追加第 28 项
#                 （volume_reduction 系数），而计划 02 的 Task 12 Step 3 那份 §14 补项清单里
#                 「动作库的视频源」排在 **#30**（fix round 3 更正：此前这里印的是 **#29**，
#                 那是本文件落地那一刻（`3ea27cc`）的旧编号；紧接着的 `d40f36c` 把 #28 让给本
#                 文件的 volume_reduction 项、Task 12 的清单去重后整体前移一位，于是原 #29
#                 变成 **#30**。计划正文那一行逐字是「**#30** 动作库的视频源（占位 `.invalid`
#                 URL；⚠️ Task 2 已把它写进 `exercises.yaml` 的头注释，本项是把它正式登记进
#                 §14）」）—— 见 task-2-report.md 的「关切与未尽事项」。
#   impact_level  high | medium | low（spec §4.4 :239 的取值域）
#   targets       素质桶名列表，取值域 = `ITEM_BUCKET` 的三个桶名
#                 endurance | strength | speed_flexibility
#                 ⚠️ `bmi` **不是**桶名：BMI 不归任何短板桶（`ITEM_BUCKET[BMI] is None`），
#                 故 `set(ITEM_BUCKET.values())` 有 4 个元素、含 None，不能当取值域用
#                 （Plan02 账本 P2-A4）
#   equipment     器械需求。无器械写 `none` 而不是留空——留空分不清「不需要」与「忘了填」。
#                 本文件用到的 9 个取值：none / band / step / cone / bike / mat / ball /
#                 ladder / medicine_ball
#
# 【条目数 24 的口径】Task 2 定下的骨架 = spec §7.2 点名的 **12** 项
# （间歇跑、复合循环、持续跑、台阶训练、自重抗阻、弹力带抗阻、兴趣球类、定向越野、
# 功能性训练、HIIT、能量消耗模块、抗阻优先模块）+ 速度柔韧类 **4** 项（50 米冲刺间歇、
# 动态拉伸、折返跑、坐位体前屈专项）= **16**，再按 18 套模板（3 层 × 3 主导短板 ×
# 2 体成分）的实际需要补 **7** 项 = **23**（Task 2 结案值），落在计划「预估 20–30 个」的
# 区间内。**Task 3 又追加 1 项 = 24**：黄层 addon 的 `energy_expenditure_plus_5min_hiit`
# （spec §7.2 :487 的「体脂偏高附加 5min HIIT」，Plan02 账本 P3-A4 裁定不复用主项 `hiit`，
# 理由写在那一节自己的注释里）。仍在「20–30」区间内。
# ⚠️ 这 12 项的**出处不止一行**（Task 2 fix round 3 更正：此前把这 12 项的归属**全部**记在
# §7.2 末尾那一行散文名下，归属不对——数字 12 / 16 / 23 都是对的）。spec §7.2 末尾那段
# 「指导文件给出的层级参数已全部落入模板」的散文确实点名了 **12** 个东西，但**其中一个是
# 「可选挑战任务」**，而本文件
# 把它算作下面的补项 7（它此前没有 ref）；反过来，本文件这 12 项里的「**抗阻优先模块**」
# 出自 §7.2 的 `addons` 代码块（`when: muscle_low` / `module: resistance_priority`），
# 那段散文里**没有**它。即：**散文的 12 项 − 可选挑战任务 + 抗阻优先模块（addons 代码块）
# = 本文件的 12 项**。「能量消耗模块」两处都点了（addons 代码块的
# `energy_expenditure_plus_10pct` 与散文的「体脂超标追加 10% 能量消耗模块」），是同一个
# 东西，不重复计数。⚠️ 而散文里的「**体脂偏高附加 5min HIIT**」在 Task 2 时**没有**被算进
# 那 12 项（它被当成主项 `hiit` 的同义重复了），Task 3 按 P3-A4 把它拆出来单独一个 ref，
# 故本文件的 24 = 那 12 项 + 4 项速度柔韧 + 7 项补项 + 1 项（5min HIIT 附加模块）。
# 补的 7 项及理由，逐条写在下面各分节的注释里。
# 条目数由 `test_sync_exercises_projects_every_ref_and_is_idempotent` 按**下界**钉住
# （`>= 20`，取自计划 Task 2 的「预估 20–30 个」）——它抓的是「动作库被截断成几条」，
# 不抓「加了一个动作」，因为**精确值已经由文件字节指纹钉住**，而简报 Step 1 明确允许
# Task 3 往本文件追加 `exercise_ref`、只要求它同步更新指纹常量。
# ⚠️ **Task 3 已经行使了那一次追加权**（24 个键、指纹同步更新）。故从 Task 4 起，
# 「追加一个 ref」不再是一条被授权的动作：本文件已被指纹钉住，改它要先改
# `EXERCISES_FINGERPRINT` 并在报告里说明理由。
# 文件字节由 `test_exercises_yaml_fingerprint_is_pinned` 钉住（CRLF 归一化为 LF 后取
# sha256 前 16 位）。
#
# 【impact_level 的分布，口径同上】high **5** 个（间歇跑、折返跑、50 米冲刺间歇、跳跃增强式、
# HIIT）、medium **11** 个、low **8** 个，合计 24。5 个 high 每一个都在
# `exercise_equivalence.yaml` 里有 low 替身、且两个触发条件各一条（共 10 条映射），由
# `test_every_high_impact_exercise_has_a_low_substitute` 钉住。
# ⚠️ Task 3 追加的那一个是 **medium**，故 high 的 5 个与 10 条映射**都没变**、
# `exercise_equivalence.yaml` 一个字没改（它的 `version` 也因此不需要升）。
#
# ⚠️ **PyYAML 对重复的顶层键是「后者覆盖前者、不报错」**（实测
# `yaml.safe_load("a: 1\na: 2") == {"a": 2}`），故「复制一段忘了改 ref」会让一个动作
# **静默消失**。守卫是 `test_exercise_refs_are_snake_case_and_unique_keys`：它用**原始文本**
# 数一遍顶层键、与解析结果对账，两侧不同源（硬规矩 #35）。

# ---------------------------------------------------------------------------
# 耐力（endurance）—— 红层 60–70% HRmax 间歇跑、黄层持续跑 + 台阶训练（spec §7.2 :487）
# ---------------------------------------------------------------------------

interval_run:
  name: 间歇跑
  video_url: https://example.invalid/exercise/interval_run
  impact_level: high
  targets: [endurance]
  equipment: none

steady_run:
  name: 持续跑
  video_url: https://example.invalid/exercise/steady_run
  impact_level: medium
  targets: [endurance]
  equipment: none

step_training:
  name: 台阶训练
  video_url: https://example.invalid/exercise/step_training
  impact_level: medium
  targets: [endurance, strength]
  equipment: step

orienteering:
  name: 定向越野
  video_url: https://example.invalid/exercise/orienteering
  impact_level: medium
  targets: [endurance]
  equipment: none

# 补项 1–2：两个 low 冲击的有氧动作。它们不是模板的主选项，而是 `exercise_equivalence.yaml`
# 里 high → low 替换的**落点**：spec §7.4 :508-509 的两个触发（BMI > 30 / 肌肉量 < P10）
# 都是关节负荷过高的医学指征，替身必须真的低冲击。快走与固定自行车是运动处方里最标准的
# 两个低冲击有氧选项（自行车把体重从关节上卸掉，快走把冲击峰值从跑的 2–3 倍体重降到
# 约 1.2 倍）。没有它们，5 个 high 动作里的 3 个（间歇跑、折返跑、50 米冲刺间歇）将无解，
# 直接落进 spec §7.4 :514 的 needs_review 路径。
# ⚠️ **「2–3 倍体重」与「约 1.2 倍」这两个数没有出处**（硬规矩 #19；fix round 3 补记）：
# spec 全文没有它们，本轮也拿不出可引用的指导文件 / 运动处方规范条文。它们是**工程估计**，
# 单位口径是「地面反作用力峰值 ÷ 体重」（无量纲倍数），只用来解释「为什么选这两个动作当
# 替身」，**不被任何测试守卫**，也**不得被 Task 7 当成 spec 条文或医学阈值引用**——这一点
# 与 `exercise_equivalence.yaml` 的 `volume_reduction` 两个系数**不同**（那两个数虽然同样
# 无 spec 出处，但已按 Plan02 账本 P2-A3 登记进 spec §14 第 28 项）。若项目组能给出实测或
# 文献出处，请替换本段并注明来源与测量口径。下面 `plyometric_jump` 那节的「反复 2–3 倍
# 体重冲击」是同一个数、同一处置。
brisk_walking:
  name: 快走
  video_url: https://example.invalid/exercise/brisk_walking
  impact_level: low
  targets: [endurance]
  equipment: none

stationary_cycling:
  name: 固定自行车
  video_url: https://example.invalid/exercise/stationary_cycling
  impact_level: low
  targets: [endurance]
  equipment: bike

# ---------------------------------------------------------------------------
# 力量（strength）—— 红层 70% 1RM 复合循环、黄层自重 + 弹力带抗阻（spec §7.2 :487）
# ---------------------------------------------------------------------------

compound_circuit:
  name: 复合循环
  video_url: https://example.invalid/exercise/compound_circuit
  impact_level: medium
  targets: [strength, endurance]
  equipment: none

bodyweight_resistance:
  name: 自重抗阻
  video_url: https://example.invalid/exercise/bodyweight_resistance
  impact_level: low
  targets: [strength]
  equipment: mat

band_resistance:
  name: 弹力带抗阻
  video_url: https://example.invalid/exercise/band_resistance
  impact_level: low
  targets: [strength]
  equipment: band

# spec §7.2 :484 的 addon 模块名 `resistance_priority`（`when: muscle_low`）。
# 本文件照那个名字命名，避免出现「模块名」与「动作 ref」两个所有者。
resistance_priority:
  name: 抗阻优先模块
  video_url: https://example.invalid/exercise/resistance_priority
  impact_level: medium
  targets: [strength]
  equipment: band

# 补项 3：红层力量短板需要一个 70% 1RM 量级的抗阻主项（spec §7.2 :476 的
# `intensity: {type: onerm_pct, value: 70}`），而复合循环是**多动作串联**、单动作强度上不去。
# 药球核心训练是可加载的单动作抗阻，且它的冲击等级是 medium（不含跳跃落地），
# 因此不需要在等价表里备 low 替身。
medicine_ball_core:
  name: 药球核心训练
  video_url: https://example.invalid/exercise/medicine_ball_core
  impact_level: medium
  targets: [strength]
  equipment: medicine_ball

# 补项 4：high 冲击的力量动作。立定跳远是国标 6 个短板判定项之一
# （`ScoredItem.STANDING_JUMP`，归 strength 桶），红层要提升它就必须有跳跃类刺激；
# 而它同时是 BMI > 30 时**最该被换掉**的动作（反复落地 = 反复 2–3 倍体重冲击；⚠️ 这个
# 倍数是**工程估计、无出处、不被任何测试守卫**，处置同上面 `brisk_walking` 那节的说明）。
# 故它在等价表里的替身是 `bodyweight_resistance`（同样的下肢力量刺激、零落地）。
plyometric_jump:
  name: 跳跃增强式训练
  video_url: https://example.invalid/exercise/plyometric_jump
  impact_level: high
  targets: [strength, speed_flexibility]
  equipment: none

# ---------------------------------------------------------------------------
# 速度柔韧（speed_flexibility）—— 计划 Task 2 Step 1 要求补的 4 项 + 2 个补项
# ---------------------------------------------------------------------------

sprint_50m_intervals:
  name: 50 米冲刺间歇
  video_url: https://example.invalid/exercise/sprint_50m_intervals
  impact_level: high
  targets: [speed_flexibility, endurance]
  equipment: none

shuttle_run:
  name: 折返跑
  video_url: https://example.invalid/exercise/shuttle_run
  impact_level: high
  targets: [endurance, speed_flexibility]
  equipment: cone

dynamic_stretching:
  name: 动态拉伸
  video_url: https://example.invalid/exercise/dynamic_stretching
  impact_level: low
  targets: [speed_flexibility]
  equipment: none

# 坐位体前屈是国标 6 个短板判定项之一（`ScoredItem.SIT_AND_REACH`，归 speed_flexibility 桶）
sit_and_reach_drill:
  name: 坐位体前屈专项
  video_url: https://example.invalid/exercise/sit_and_reach_drill
  impact_level: low
  targets: [speed_flexibility]
  equipment: mat

# 补项 5：绿层速度柔韧短板需要一个 medium 档的敏捷主项。绿层每周只 2 天（spec §7.2 :487），
# 两个 low 档的拉伸类动作撑不起一次课的主体部分。绳梯敏捷是标准选项，且不含跳跃落地，
# 故为 medium、不需要 low 替身。
agility_ladder:
  name: 绳梯敏捷
  video_url: https://example.invalid/exercise/agility_ladder
  impact_level: medium
  targets: [speed_flexibility]
  equipment: ladder

# 补项 6：坐位体前屈这一项在国标里是**柔韧**，而柔韧的提升除了动态拉伸还需要 PNF
# （本体感觉神经肌肉促进）这一档更有效的静态手法，且它需要弹力带或同伴辅助。
# 它是 low 冲击，因此也可以充当 speed_flexibility 类动作在安全后置下的替身。
pnf_stretching:
  name: 本体感觉神经肌肉促进拉伸
  video_url: https://example.invalid/exercise/pnf_stretching
  impact_level: low
  targets: [speed_flexibility]
  equipment: band

# ---------------------------------------------------------------------------
# 兴趣 / 综合，与三个 addon 模块（spec §7.2 :480-487）
# ⚠️ 本节 6 个条目**跨红 / 黄 / 绿三层**，不是清一色绿层（Task 2 fix round 3 更正：节标题
# 此前写「绿层兴趣 / 综合」，而本节里 `hiit` 自己的注释写的是**黄层**、
# `energy_expenditure_plus_10pct` 写的是**红层**）：interest_ball_games（绿层）/
# functional_training（绿层）/ hiit（**黄层**主项）/
# energy_expenditure_plus_10pct（**红层** addon，「体脂超标追加 10% 能量消耗模块」）/
# energy_expenditure_plus_5min_hiit（**黄层** addon，「体脂偏高附加 5min HIIT」，Task 3 追加）/
# challenge_task（绿层，「可选挑战任务」）。逐条的层归属见各自注释。
# ⚠️ 别把两个维度混起来：这里的「层」是**红/黄/绿分层**（spec §7.2 的训练频次与参数档位），
# 与条目的 `impact_level`（high/medium/low **冲击**）无关——本节标题说的是前者。
# ⚠️ 也别把「主项」与「addon 模块」混起来：本节的 `hiit` 是**主项**（有 high 冲击、在等价表里
# 有 low 替身），另两个 `energy_expenditure_plus_*` 是 **addon 模块**（走 spec §7.4 :510
# 那条路、不查等价表）。P3-A4 的裁定就是为了不把这两类混成一个 ref。
# ---------------------------------------------------------------------------

interest_ball_games:
  name: 兴趣球类
  video_url: https://example.invalid/exercise/interest_ball_games
  impact_level: medium
  targets: [endurance, speed_flexibility]
  equipment: ball

functional_training:
  name: 功能性训练
  video_url: https://example.invalid/exercise/functional_training
  impact_level: low
  targets: [strength, speed_flexibility]
  equipment: none

# spec §7.2 :487「体脂偏高附加 5min HIIT」（黄层）里的 **HIIT 主项**。high 冲击，
# 故在等价表里备 low 替身（`hiit` → `functional_training`，两个触发各一条）。
# ⚠️ **Task 3 起它不再是那半句散文的唯一对应物**：散文里的「附加 5min HIIT」现在由
# `energy_expenditure_plus_5min_hiit`（下面第二个 addon）承接，本条目是**HIIT 作为一个
# 主项动作**存在（P3-A4：两者不得混成一个 ref，否则 Task 7 分不清「换替身」与「取消追加」）。
# ⚠️ **本条目今天没有任何模板引用它**（硬规矩 #39）：指导文件没有把 HIIT 列为任何
# 「层 × 短板」的主项，Task 3 的 18 套模板也就没用它。它的两条等价映射因此今天不会被
# 触发。**不删它**：删了 `exercise_equivalence.yaml` 的两条映射就悬空
# （`test_equivalence_table_only_maps_to_existing_exercises` 会红），而那份表的**数据部分**
# 本 Task 不许动。已作为关切报给控制者（要么将来某一套模板用它，要么连同两条映射一起下线）。
hiit:
  name: 高强度间歇训练
  video_url: https://example.invalid/exercise/hiit
  impact_level: high
  targets: [endurance, strength]
  equipment: none

# spec §7.2 :482 的 addon 模块名 `energy_expenditure_plus_10pct`（`when: body_fat_over`，
# 红层 +10% 能量消耗）。⚠️ 它是 spec §7.4 :510 第三个触发（体脂率异常）走的那条路
# ——**追加模板 addons 里的能量消耗模块，不查等价表**（Plan02 账本 P2-C3），故它在
# `exercise_equivalence.yaml` 里既不是 from 也不是 to。
# ⚠️ 这个名字曾经是 **29** 字符、本文件最长的 ref（它决定 `exercise.ref` 的列宽下界）。
# Task 3 追加的 `energy_expenditure_plus_5min_hiit` 是 **33** 字符，最长者已换成它，
# 见下面那一节的注释与 `test_exercise_string_column_widths_fit_the_yaml_values`。
energy_expenditure_plus_10pct:
  name: 能量消耗模块
  video_url: https://example.invalid/exercise/energy_expenditure_plus_10pct
  impact_level: medium
  targets: [endurance]
  equipment: none

# spec §7.2 :487 的散文「黄层…**体脂偏高附加 5min HIIT**」对应的 addon 模块名
# （`when: body_fat_over`，黄层）。**Task 3 按 Plan02 账本 P3-A4 追加的第 24 个 ref**
# （计划 `:183` 明确授权 Task 3 往本文件追加、同时更新指纹常量）。
#
# ⚠️ **为什么不复用已有的 `hiit`**（P3-A4 的裁定原文）：`hiit` 是一个**有自己
# `impact_level`（high）的主项动作**，而「附加 5min HIIT」是**体成分异常时追加的模块**
# ——与上面那个 `energy_expenditure_plus_10pct` 同构（都是 addon、都不是主项）。
# 把两者混成一个 ref，Task 7 的安全后置就**无法区分**「这一套的主项是 HIIT」与
# 「这一套在体脂超标时追加一个 5 分钟的 HIIT 模块」，而两者的处置完全不同：
# 前者要查等价表换低冲击替身（`hiit` → `functional_training`），后者按 spec §7.4 :510
# **不查等价表**、只是追加或取消。
#
# **`impact_level: medium` 的理由**：它与 `energy_expenditure_plus_10pct` 同构（同一个
# `when`、同一个用途），那一个是 medium；且它是**追加**模块而不是主项，5 分钟的量
# 不足以构成 high 冲击的关节负荷。medium 不需要在等价表里备 low 替身
# （`test_every_high_impact_exercise_has_a_low_substitute` 只遍历 high），故
# `exercise_equivalence.yaml` **一个字没改**（它的 `version` 也因此不需要升）。
# ⚠️ 但这就产生了一个**不对称**：主项 `hiit` 是 high、有两条 low 映射；本模块是 medium、
# 没有映射。于是一个 BMI > 30 的黄层学生会看到「主项 HIIT 被换成低冲击的功能性训练，
# 而追加的那个 5min HIIT 模块原样保留」。这是 P3-A4 那条裁定（「不要复用 hiit」）的
# 直接后果，不是疏漏；要消除它得让 Task 7 对 addon 也做一次冲击检查，而 spec §7.4 :510
# 只写了「追加模板 addons 中的能量消耗模块」、没写要检查冲击。**已作为关切报给控制者。**
#
# 这个 33 字符的名字是**本文件最长的 ref**，决定了 `exercise.ref` 的列宽下界
# （声明 String(48)，余量 15 字符；由
# test_exercise_string_column_widths_fit_the_yaml_values 现读现比）。
energy_expenditure_plus_5min_hiit:
  name: 5 分钟 HIIT 附加模块
  video_url: https://example.invalid/exercise/energy_expenditure_plus_5min_hiit
  impact_level: medium
  targets: [endurance]
  equipment: none

# 补项 7：spec §7.2 :487 的绿层写「兴趣球类/定向越野/功能性训练 + **可选挑战任务**」，
# 那句里点到的第四个东西此前没有 ref。它是 medium 冲击、同时瞄准三个桶（挑战任务的形式
# 由教师定，可能是接力、可能是闯关），故在等价表里也不是端点。
# ⚠️ 变异验收 ② 用的正是这个 ref：删掉它，全仓**只有**指纹测试会红——因为没有任何一条
# **映射**依赖它（实测它既不是任何映射的 `from`、也不是任何映射的 `to`），也没有任何一条
# 断言会**因为它消失**而变红。⚠️ 这两件事必须分开说（fix round 3 更正：此前把「映射」与
# 「断言」并在同一句里一起否定，其中关于断言的那半句字面上不成立）——
# `tests/test_refdata_prescription.py` 的
# `test_lookup_honours_the_impact_ceiling_and_returns_none_when_unsolvable` 把这个 ref
# **硬编码**进了断言，当「无映射的 ref」探针用（`assert table.lookup("challenge_task", …)
# is None`）；而 `lookup` 只查等价表、不查动作库，故删掉它那条**仍然绿**，只是探针语义变弱
# （它不再证明「动作库里有、等价表里没有的 ref 返回 None」，只证明「等价表里没有的 ref
# 返回 None」）。（Plan02 账本 P2-C1：原文还要求「模板引用存在性」测试变红，而那个测试是
# Task 3 才建的。）
challenge_task:
  name: 可选挑战任务
  video_url: https://example.invalid/exercise/challenge_task
  impact_level: medium
  targets: [endurance, strength, speed_flexibility]
  equipment: none
