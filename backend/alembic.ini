# Alembic configuration for the XMU Physical-Education IMS (Plan 06 Task 1).
#
# !! THIS FILE MUST STAY PURE ASCII. !!
#    Empirically verified on this machine (Windows / Python 3.11.1 / alembic 1.20.0):
#    alembic.util.compat.read_config_parser() reads this file with
#    encoding="locale", i.e. GBK here. A UTF-8 Chinese comment makes every
#    `alembic ...` command die before it starts with
#        UnicodeDecodeError: 'gbk' codec can't decode byte 0x80 in position 30
#    so the Chinese rationale lives in migrations/env.py and in spec section 13.7,
#    both of which are read as UTF-8 by Python. Do not "helpfully" translate
#    this file.
#
# !! THERE IS NO DATABASE URL IN THIS FILE, AND THERE MUST NOT BE ONE. !!
#    The single owner of "which database" is the environment variable PE_DB_URL
#    (the name lives in backend/app/main.py as DB_URL_ENV_VAR) -- the very same
#    one the app reads at runtime. The `sqlalchemy.url` line below is an empty
#    placeholder and migrations/env.py deliberately never reads it. Reason, in
#    one line: a connection string written twice always has one copy that is a
#    relative path, and neither copy errors out -- one of them is just forever
#    an empty database. (This is exactly why app/db/session.py's engine() has no
#    default URL argument.)
#
# Command line usage (from backend/):
#     $env:PE_DB_URL = python -c "from app.main import DEMO_DB_URL; print(DEMO_DB_URL)"
#     python -m alembic upgrade head
#     python -m alembic revision --autogenerate -m "..."
#
# Normally you do NOT run alembic by hand: app.db.session.init_db walks the
# three-way branch by itself (missing file -> upgrade head; existing file
# without an alembic_version table -> stamp the baseline; versioned file ->
# upgrade head). Hand-running it is only needed to author a new revision after
# editing app/db/models/**; the workflow is spec section 13.7.

[alembic]
# Migration script directory. %(here)s is the directory holding this ini file
# (= backend/), so this is independent of the current working directory.
script_location = %(here)s/migrations

# Template for generated revision filenames (alembic's default, kept verbatim).
# file_template = %%(rev)s_%%(slug)s

# Extra sys.path entry. NOTE: env.py also inserts backend/ into sys.path
# unconditionally, so `alembic -c backend/alembic.ini ...` works from the repo
# root as well; this line only spares that fallback on the common path.
prepend_sys_path = .

# Path separator semantics (alembic 1.10+ default for newly written ini files).
path_separator = os

# Database URL. ALWAYS EMPTY -- see the header above. The real value comes from
# PE_DB_URL, or is handed in programmatically by init_db / the migration guard
# tests through Config.attributes["pe_db_url"].
sqlalchemy.url =

# Encoding used when a revision file is written out from script.py.mako.
# Pinned explicitly rather than left to the default: revision docstrings in this
# repo are Chinese, and the default would be the platform locale (GBK here).
output_encoding = utf-8


[post_write_hooks]
# Deliberately no hooks: this backend has no black / ruff toolchain, and naming
# an executable that does not exist makes `alembic revision` fail on the spot.


# ---------------------------------------------------------------------------
# Logging. The four sections below are LOAD-BEARING: migrations/env.py calls
# logging.config.fileConfig(config.config_file_name) on this file, and dropping
# any one of them makes every `alembic` command raise a missing-section error
# from configparser during startup.
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
