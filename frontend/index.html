<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="体育闭环原型系统 —— 学生端训练打卡、教师端分层大屏与管理台。视觉语言：北欧公共标识（Nordic public signage）。"
    />
    <title>体育闭环原型系统</title>

    <!--
      ⚠️ 字体（Plan 05B 计划 §2 第 4 条：四款 → **两款**；`frontend-design` 技能
      明令禁止 Inter / Roboto / Arial / system-ui，也点名不要收敛到 Space Grotesk）：
        Hanken Grotesk 400/500/600/700/800 —— UI 与数字（人文主义无衬线、开放字腔，
                                             正是北欧公共标识那一族的气质）
        Noto Sans SC   400/500/700         —— 中文（⚠️ 宋体的 Noto Serif SC **删了**：
                                             它是《田径场年鉴》味道的主要来源）
        JetBrains Mono 400/700             —— ⚠️ 只在**口令**与**错误 code / JSON 原文**
                                             那些地方用（计划允许保留这一档）
      ⚠️ 删掉的两款：`Barlow Condensed`（窄体计时牌）与 `Noto Serif SC`（宋体年鉴）。
      `preconnect` 是承重的：三个字体族来自两个域，不预连的话首屏要串行等 DNS+TLS。
      ⚠️ 中文回退栈在 `src/styles/tokens.css` 的 `--font-*` 里给全
      （`"PingFang SC", "Microsoft YaHei", sans-serif`），离线时不会掉到宋体默认。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
