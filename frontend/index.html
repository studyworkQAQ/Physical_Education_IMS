<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="体育闭环原型系统 —— 学生端训练打卡、教师端分层大屏与管理台。视觉语言：北欧公共标识（Nordic public signage）。"
    />
    <title>体育闭环原型系统</title>

    <!--
      ⚠️⚠️ **这里不再有任何字体 `<link>` / `preconnect`**（交付前收尾波 ② 删的）。
      改前这一段从 Google Fonts 的 CDN 拉三款字体族（`document.fonts.size` 实测 335 个面）。
      删掉的理由：① 甲方内网大概率直接挡那两个域；② **字体不可达会直接破坏布局**
      （CDP 三组对照实验实测：挡掉时 11 条路由里 6 条报文本重叠、合计 15 处，放行时 0 处）；
      ③ 一个要交付的原型不该在首屏发 4 个跨域请求。
      现在的住址是 **`src/styles/fonts.css`**（自托管的 woff2 在 `src/assets/fonts/`，
      4 个文件合计 97 348 B），由 `src/main.ts` 第一个 import；字体族令牌在
      `src/styles/tokens.css` 的 `--font-*`。⚠️ **完整取证与那三条度量 override 的来历
      写在 `fonts.css` 的文件头**（CSS 注释会被压缩器剥掉，故写在那里是零成本的；
      本文件是 HTML，Vite **不剥**它的注释 —— 这一段会原样发到客户端，故只留指针）。
      产物里那两个域出现 0 次由 `npm run check:dist` 断言（`smoke.mjs` 第 15 步会 spawn 它）。
    -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
